server:
  port: 8080

spring:
  application:
    name: ai-knowledge-decision-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  # Spring AI Ollama configuration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2:3b}

app:
  jwt:
    secret: ${JWT_SECRET:SuperSecretSecureKeyForAIAssistantApplicationWithAtLeast256BitsLong2024!}
    expiration-ms: 86400000 # 24 hours
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  llm:
    provider: ${LLM_PROVIDER:ollama} # Ollama is the default primary provider
    ollama:
      base-url: ${spring.ai.ollama.base-url:${OLLAMA_BASE_URL:http://localhost:11434}}
      model: ${spring.ai.ollama.chat.options.model:${OLLAMA_MODEL:llama3.2:3b}}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
